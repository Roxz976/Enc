name: Soul Bot - Long Running Telegram Bot

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:

jobs:
  run-soul-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360  # 6 hours max
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          # Soul bot ke liye required packages
          pip install python-telegram-bot PyGithub
          echo "✅ All packages installed successfully"
          echo ""
          echo "📦 Installed packages:"
          pip list | grep -E "telegram|github"
      
      - name: Verify installations
        run: |
          python3 -c "import telegram; print(f'✅ python-telegram-bot version: {telegram.__version__}')"
          python3 -c "import github; print('✅ PyGithub installed successfully')"
          echo "✅ All imports working"
      
      - name: Create required JSON files
        run: |
          # Create all JSON files needed by soul.py
          json_files="users.json pending_users.json approved_users.json owners.json admins.json groups.json resellers.json github_tokens.json attack_state.json maintenance.json cooldown.json max_attacks.json trial_keys.json user_attack_counts.json"
          
          for file in $json_files; do
            if [ ! -f "$file" ]; then
              if [ "$file" = "owners.json" ]; then
                # Initialize owners with admin ID 7352008650
                echo '{"7352008650": {"username": "primary_owner", "added_by": "system", "added_date": "'$(date +"%Y-%m-%d %H:%M:%S")'", "is_primary": true}}' > "$file"
              elif [ "$file" = "pending_users.json" ] || [ "$file" = "github_tokens.json" ]; then
                echo "[]" > "$file"
              else
                echo "{}" > "$file"
              fi
              echo "✅ Created $file"
            fi
          done
          
          echo ""
          echo "📁 All data files ready:"
          ls -la *.json
      
      - name: Make script executable
        run: |
          chmod +x soul.py 2>/dev/null || true
          echo "✅ soul.py ready"
      
      - name: Check soul.py syntax
        run: |
          python3 -m py_compile soul.py
          echo "✅ soul.py syntax is valid"
      
      - name: Run Soul Bot
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━"
          echo "🤖 STARTING SOUL BOT"
          echo "━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏰ Started at: $(date)"
          echo "📡 Bot token: ${BOT_TOKEN:0:10}..."
          echo "━━━━━━━━━━━━━━━━━━━━━━"
          
          # Run the bot
          python3 soul.py
        env:
          # Bot token is hardcoded in soul.py, but we can also pass via env
          BOT_TOKEN: "7914185815:AAFDeB6rC8by4LojkIyRIWeGGTdJXY429X0"
        continue-on-error: false
      
      - name: Keep alive on failure
        if: failure()
        run: |
          echo "⚠️ Bot stopped, keeping workflow alive..."
          sleep 1800  # 30 minutes
          echo "✅ Workflow completed"
