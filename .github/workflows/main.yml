name: BGMI Auto Runner

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes (bot ko alive rakhne ke liye)
  workflow_dispatch:

jobs:
  bgmi-runner:
    runs-on: tenki-standard-medium-4c-8g  # Your custom runner

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyTelegramBotAPI requests python-dotenv

    - name: Create .env file
      env:
        API_URL: ${{ secrets.API_URL }}
        API_KEY: ${{ secrets.API_KEY }}
      run: |
        echo "API_URL=${{ secrets.API_URL }}" >> .env
        echo "API_KEY=${{ secrets.API_KEY }}" >> .env

    - name: Execute group.py
      run: |
        if [ -f "group.py" ]; then
          echo "✅ Found group.py, starting bot..."
          timeout 3540 python group.py  # 59 minutes timeout (GitHub Actions limit)
        else
          echo "❌ group.py not found!"
          exit 1
        fi

    - name: Success message
      run: echo "✅ Workflow completed at $(date)"
