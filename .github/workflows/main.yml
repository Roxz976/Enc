name: BGMI Auto Runner

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  bgmi-runner:
    runs-on: tenki-standard-medium-4c-8g

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install telebot flask aiogram pyTelegramBotAPI python-telegram-bot pytest


    - name: Make scripts executable
      run: chmod +x * || true

    - name: Execute main script
      run: |
        if [ -f "m.py" ]; then
          python3 m.py
        else
          echo 'print("BGMI Workflow Running Successfully!")' > m.py
          python3 m.py
        fi


    - name: Success message
      run: echo "✅ Workflow 100% completed at $(date)"