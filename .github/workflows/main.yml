name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          # Extract your project
          unzip -o AutoAttackApp.zip
          cd AutoAttackApp
          # Build command here
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: '**/*.apk'
