name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Extract ZIP file
      run: |
        # Find zip file
        ZIP_FILE=$(find . -name "*.zip" -type f | head -1)
        
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ No ZIP file found!"
          exit 1
        fi
        
        echo "✅ Found ZIP: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d ./extracted/
        
        # Copy contents to root
        if [ -d "./extracted/StressTestApp5" ]; then
          cp -r ./extracted/StressTestApp5/* ./
        elif [ -d "./extracted/app" ]; then
          cp -r ./extracted/* ./
        else
          cp -r ./extracted/* ./
        fi
        
        echo "✅ Extraction complete"
        ls -la
    
    - name: Fix XML path error
      run: |
        # Fix network_security_config.xml path
        if [ -f "app/src/main/res/xml/net/work_security_config.xml" ]; then
          mkdir -p app/src/main/res/xml
          mv app/src/main/res/xml/net/work_security_config.xml app/src/main/res/xml/network_security_config.xml 2>/dev/null || true
          rm -rf app/src/main/res/xml/net 2>/dev/null || true
        fi
        
        # Create if missing
        if [ ! -f "app/src/main/res/xml/network_security_config.xml" ]; then
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/network_security_config.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="true">retrostress.net</domain>
        <domain includeSubdomains="true">127.0.0.1</domain>
    </domain-config>
    <base-config cleartextTrafficPermitted="true" />
</network-security-config>
EOF
        fi
        
        echo "✅ XML path fixed"
    
    - name: Fix missing files
      run: |
        # Create missing drawable if needed
        mkdir -p app/src/main/res/drawable
        
        # Create missing mipmap icons if missing
        for size in hdpi mdpi xhdpi xxhdpi xxxhdpi; do
          mkdir -p app/src/main/res/mipmap-$size
          if [ ! -f "app/src/main/res/mipmap-$size/ic_launcher.png" ]; then
            echo "Creating placeholder for mipmap-$size"
          fi
        done
        
        # Create gradle wrapper if missing
        if [ ! -f "gradlew" ]; then
          echo "Creating gradle wrapper..."
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          echo '#!/bin/bash' > gradlew
          echo 'exec gradle "$@"' >> gradlew
          chmod +x gradlew
        fi
        
        echo "✅ Missing files fixed"
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
    
    - name: Fix gradle permissions
      run: |
        chmod +x gradlew 2>/dev/null || true
        chmod +x gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
    
    - name: Build APK
      run: |
        ./gradlew clean assembleDebug --no-daemon --stacktrace
      continue-on-error: false
    
    - name: Find and upload APK
      uses: actions/upload-artifact@v4
      with:
        name: StressTestApp5-APK
        path: |
          **/*.apk
        if-no-files-found: warn
    
    - name: List files (debug)
      if: always()
      run: |
        echo "=== Directory structure ==="
        find . -type d | head -30
        echo ""
        echo "=== Looking for APK ==="
        find . -name "*.apk"
        echo ""
        echo "=== Build output ==="
        ls -la app/build/outputs/ 2>/dev/null || echo "No build output yet"
