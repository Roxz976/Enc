name: Soul Bot - Long Running Telegram Bot

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-soul-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot==20.7 requests beautifulsoup4 feedparser
          echo "✅ Packages installed"
      
      - name: Verify installations
        run: |
          python3 -c "import telegram; print('✅ telegram-bot')"
          python3 -c "import requests; print('✅ requests')"
          python3 -c "import bs4; print('✅ beautifulsoup4')"
          python3 -c "import feedparser; print('✅ feedparser')"
          echo "✅ All imports working"
      
      - name: Create required JSON files
        run: |
          # Files needed for y.py
          files="users.txt pending_verification.json verified_users.json last_subscriber_count.txt"
          
          for file in $files; do
            if [ ! -f "$file" ]; then
              if [ "$file" = "users.txt" ]; then
                echo "" > "$file"
              elif [ "$file" = "last_subscriber_count.txt" ]; then
                echo "0" > "$file"
              else
                echo "{}" > "$file"
              fi
              echo "✅ Created $file"
            fi
          done
          
          echo ""
          echo "📁 Files created:"
          ls -la
      
      - name: Make script executable
        run: |
          chmod +x y.py 2>/dev/null || true
          echo "✅ y.py ready"
      
      - name: Check syntax
        run: |
          python3 -m py_compile y.py
          echo "✅ Syntax valid"
      
      - name: Run Bot
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━"
          echo "🤖 STARTING SOUL BOT"
          echo "━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏰ Started at: $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━"
          python3 y.py
        env:
          BOT_TOKEN: "8179448288:AAGzOSPYhhGjUiTr2h-UMzbaSPmYnAaUjbY"
      
      - name: Keep alive
        if: failure()
        run: |
          echo "⚠️ Bot stopped, retrying..."
          sleep 60
