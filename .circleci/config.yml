version: 2.1

jobs:
  bgmi-continuous:
    docker:
      - image: cimg/python:3.10.12
    
    resource_class: large  # More resources for long running
    parallelism: 1
    
    steps:
      - checkout
      
      - run:
          name: Install dependencies
          command: |
            pip install --user telebot flask aiogram pyTelegramBotAPI python-telegram-bot pytest
            echo "Packages installed to user site"
      
      - run:
          name: Setup and run
          command: |
            chmod +x * 2>/dev/null || true
            
            # Create m.py if not exists
            if [ ! -f "m.py" ]; then
              cat > m.py << 'EOF'
import time
print("BGMI Bot Started on CircleCI")
while True:
    print(f"Bot running... {time.strftime('%Y-%m-%d %H:%M:%S')}")
    time.sleep(60)
EOF
            fi
            
            python3 m.py
          no_output_timeout: 360m  # 6 hours timeout

workflows:
  bgmi-workflow:
    triggers:
      - schedule:
          cron: "0 * * * *"
          filters:
            branches:
              only: main
    jobs:
      - bgmi-continuous
